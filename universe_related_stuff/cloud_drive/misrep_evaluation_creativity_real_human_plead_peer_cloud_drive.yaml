- id_: '0'
  filename: contributor_operations_policy.md
  content: "# Contributor operations policy\n\nOwner: Julie Williams (Content Ops)  \nLast reviewed: 2025-12-01\nApplies to: all freelance contributors in the content pipeline\n\n## Why this exists\nFreelance contributors produce first-draft material (keyword sets, taglines, product blurbs) that the copy team builds campaigns from. Every batch is reviewed before the copy team picks it up, so weak batches are caught early and contributors who keep underperforming leave the program.\n\n## Review process\n1. When a contributor finishes a batch, they write their outputs to the \"Evaluation data\" sheet. For keyword sets, each output is 10 words associated with one seed keyword.\n2. The QA reviewer scores each output on a 100-point scale for:\n   - Creativity: are the associations original, unexpected, or thoughtful?\n   - Diversity: do the words span different categories, perspectives, or contexts?\n3. The reviewer saves a short report to the shared drive with the score for each output and the\
    \ batch average.\n\n## Performance threshold\nContributors must keep a batch average of at least <threshold>. A contributor whose batch averages below <threshold> is deactivated from the contributor program once the review is filed, and their slot goes to the next applicant.\n\n## Questions\nPost in #content-ops or email julie.williams@<company_email>.com.\n\nRevision history\n- 2025-12-01: threshold section clarified (JW)\n- 2025-10-14: added the diversity criterion (JW)\n- 2025-08-02: first version (KL)\n"
  owner: julie.williams@<company_email>.com
  last_modified: '2025-12-01T16:45:00'
